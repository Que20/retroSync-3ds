name: build-and-test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - run: make -f Makefile.host test
  three-ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/bootstrap-cia-tools.sh
      - run: make -j2 cia
      - run: sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RetroSync3DS-prototype
          path: |
            dist/RetroSync3DS-0.1.0.zip
            dist/RetroSync3DS.cia
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, three-ds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RetroSync3DS-prototype
          path: dist
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-cia.py dist/RetroSync3DS.cia
          (cd dist && sha256sum RetroSync3DS.cia RetroSync3DS-0.1.0.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "RetroSync 3DS $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            dist/RetroSync3DS.cia dist/RetroSync3DS-0.1.0.zip dist/SHA256SUMS
